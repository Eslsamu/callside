name: Windows download diagnostic

on:
  push:
    branches: [codex/windows-download-isolation]
    paths:
      - '.github/workflows/windows-download-diagnostic.yml'
      - 'scripts/windows-package-inspection.py'

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download the completed test packages for static inspection
        uses: actions/download-artifact@v4
        with:
          run-id: 38144979458
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: Callside-Windows-Test-x64-*
          path: .local/package-inspection/artifacts
      - name: Verify hashes, component removal and identical portable app payload
        run: python3 scripts/windows-package-inspection.py
      - name: Retain inspection evidence without redistributing the packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Callside-Windows-Package-Inspection-45588b5
          path: |
            .local/package-inspection/verification.json
            .local/package-inspection/installer-list.txt
          if-no-files-found: error
          retention-days: 30
      - name: Summarize the package check
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Static package verification

          Inspected the exact packages from [Windows test build 45588b5](https://github.com/Eslsamu/callside/actions/runs/38144979458).
          Verified package checksums and build commit, removal of SpiderBanner.dll and elevate.exe,
          and byte-identical application files between the installer and complete portable ZIP.

          No package was rebuilt, repackaged, installed or executed by this job.
          This does not establish Chrome acceptance or Windows installation behavior.
          SUMMARY
